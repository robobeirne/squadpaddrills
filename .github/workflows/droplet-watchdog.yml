name: DigitalOcean Droplet lifetime watchdog

# This independent controller must already be running outside the VM before
# creation. The readiness variable only enables the workflow; it is not proof
# of live arming. Inspect its current armed receipt before creating the unique
# planned name, then confirm the bound provider ID and configuration.
on:
  workflow_dispatch:
    inputs:
      planned_name:
        description: Unique squadpad-native- name with an 8-40 character suffix
        required: true
        type: string
      size_slug:
        description: Size slug verified from the live provider catalogue
        required: true
        type: string
      image_id:
        description: Numeric ID of the verified Ubuntu 22.04 x86-64 image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: squadpad-droplet-watchdog
  cancel-in-progress: false

jobs:
  watch-lifetime:
    name: Supervise one approved fresh Droplet independently
    if: github.repository == 'robobeirne/squadpaddrills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Require explicit watchdog readiness before secret access
        env:
          SQUADPAD_DO_WATCHDOG_ENABLED: ${{ vars.SQUADPAD_DO_WATCHDOG_ENABLED }}
        run: |
          python3 -B - <<'PY'
          import os
          import sys
          if os.environ.get("SQUADPAD_DO_WATCHDOG_ENABLED") != "true":
              sys.exit("The Droplet watchdog is disabled. Prepare its restricted cleanup token and independent controller before enabling it. Readiness does not prove live arming.")
          PY

      - name: Check out the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up the controller's Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Arm and supervise the planned Droplet
        if: success() && vars.SQUADPAD_DO_WATCHDOG_ENABLED == 'true'
        env:
          SQUADPAD_PLANNED_NAME: ${{ inputs.planned_name }}
          SQUADPAD_SIZE_SLUG: ${{ inputs.size_slug }}
          SQUADPAD_IMAGE_ID: ${{ inputs.image_id }}
          SQUADPAD_DO_TOKEN: ${{ secrets.SQUADPAD_DO_CLEANUP_TOKEN }}
        shell: bash
        run: |
          SQUADPAD_RECEIPT_DIR="$(mktemp -d "$RUNNER_TEMP/squadpad-do-watchdog.XXXXXXXX")"
          SQUADPAD_WATCHDOG_RECEIPT="$SQUADPAD_RECEIPT_DIR/receipt.json"
          printf 'SQUADPAD_WATCHDOG_RECEIPT=%s\n' "$SQUADPAD_WATCHDOG_RECEIPT" >> "$GITHUB_ENV"
          python3 -B Tools/Cloud/droplet_watchdog.py \
            --name "$SQUADPAD_PLANNED_NAME" \
            --size "$SQUADPAD_SIZE_SLUG" \
            --image-id "$SQUADPAD_IMAGE_ID" \
            --receipt "$SQUADPAD_WATCHDOG_RECEIPT" \
            --watch

      - name: Summarize observed cleanup without a billing-cap claim
        if: always()
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Droplet lifetime watchdog", ""]
          report = None
          path_value = os.environ.get("SQUADPAD_WATCHDOG_RECEIPT")
          if path_value:
              try:
                  candidate = json.loads(Path(path_value).read_text(encoding="utf-8"))
                  if isinstance(candidate, dict) and candidate.get("schema") == "squadpad.droplet-watchdog.v1":
                      report = candidate
              except (OSError, ValueError):
                  pass
          if report is None:
              lines.extend(["No valid controller receipt was produced. Arming and cleanup are unverified.", ""])
          else:
              statuses = {"starting", "armed", "bound", "deleting", "deleted_verified", "failed", "preflight_only"}
              raw_status = report.get("status")
              status = raw_status if isinstance(raw_status, str) and raw_status in statuses else "unknown"
              clean = {"status": status, "billing_cap_guaranteed": False}
              for key in ("provider_api_contacted", "armed", "deletion_verified", "deletion_before_deadline"):
                  clean[key] = report.get(key) is True
              for key in ("requests", "delete_attempts", "transient_errors"):
                  value = report.get(key)
                  clean[key] = value if type(value) is int and value >= 0 else None
              bound = report.get("bound")
              identity = bound.get("id") if isinstance(bound, dict) else None
              clean["bound_droplet_id"] = identity if type(identity) is int and identity > 0 else None
              lines.extend(["```json", json.dumps(clean, indent=2), "```", ""])
          lines.extend([
              "The readiness variable enables this workflow. It does not establish live arming.",
              "Inspect the current armed receipt before creating the uniquely named VM, and confirm its bound ID.",
              "Only deleted_verified with deletion_before_deadline=true records observed absence within the configured window.",
              "Cancellation, controller timeout or provider failure can prevent cleanup and this summary.",
              "This controller creates no resources and does not guarantee a billing cap or cover account-level extras.",
              "Receipts remain in job logs and temporary runner storage; no artifacts are uploaded.",
          ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
